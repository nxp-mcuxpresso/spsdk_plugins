name: Publish To PyPi

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  get-packages:
    name: Get Package List
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get-packages.outputs.packages }}
      compiled_packages: ${{ steps.get-packages.outputs.compiled_packages }}
      pure_python_packages: ${{ steps.get-packages.outputs.pure_python_packages }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install TOML parser
        run: pip install toml
          
      - id: get-packages
        run: |
          python -c "
          import toml, json
          config = toml.load('pyproject.toml')['tool']['release-tools']
          all_packages = config['sub_projects']
          compiled = ['iped', 'pqc']
          pure = [p for p in all_packages if p not in compiled]
          print(f'packages={json.dumps(all_packages)}')
          print(f'pure_python_packages={json.dumps(pure)}')
          print(f'compiled_packages={json.dumps(compiled)}')
          " >> $GITHUB_OUTPUT

  build_sdist:
    name: Build Packages
    needs: [get-packages]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    strategy:
      matrix:
        package: ${{fromJson(needs.get-packages.outputs.packages)}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and Check Package
        uses: hynek/build-and-inspect-python-package@v2.18.0
        with:
          path: ${{ matrix.package }}
          attest-build-provenance-github: 'true'
          upload-name-suffix: -${{ matrix.package }}
          skip-wheel: 'true'

  deploy_sdist:
    name: Upload Releases To PyPI
    needs: [get-packages, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{fromJson(needs.get-packages.outputs.packages)}}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Download Package
        uses: actions/download-artifact@v4.3.0
        with:
          name: Packages-${{ matrix.package }}
          path: dist

      - name: Publish packages to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          skip-existing: true
          verbose: true

  build_pure_wheels:
    name: Build Pure Python Wheels
    runs-on: ubuntu-latest
    needs: [get-packages]
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # All packages except pqc (which has C extensions)
        package: ${{fromJson(needs.get-packages.outputs.pure_python_packages)}}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build universal wheel
        run: python -m build --wheel --outdir dist  ${{ matrix.package }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-${{ matrix.package }}-pure
          path: dist/*.whl
          overwrite: true

  build_compiled_wheels:
    name: Wheel ${{ matrix.package}} on ${{ matrix.os}}
    runs-on: ${{ matrix.os }}
    needs: [get-packages]
    strategy:
      fail-fast: false
      matrix:
        # Exactly one runner per architecture, otherwise the wheel file names clash:
        # macos-latest builds arm64 wheels, macos-15-intel builds x86_64 wheels
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
        package: ${{fromJson(needs.get-packages.outputs.compiled_packages)}}
    environment:
      name: pypi
      url: https://pypi.org/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        name: Install Python
        with:
          python-version: '3.x'

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: ${{ matrix.package }}
          output-dir: dist
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* cp314t-*"

      - name: Publish packages to GH
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.os }} # this is a "artifact already exists" workaround
          path: dist/*.whl
          overwrite: true


  deploy_wheels:
    name: Deploy Wheels to PyPI (${{ matrix.package }})
    needs: [get-packages, build_compiled_wheels, build_pure_wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/
    permissions:
      id-token: write
    # One upload per plugin: an upload error of one plugin must not block the wheels of the others
    strategy:
      fail-fast: false
      matrix:
        package: ${{fromJson(needs.get-packages.outputs.packages)}}
    steps:
      - uses: actions/checkout@v4
      
      - name: Create dist directory
        run: mkdir -p dist
      
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.package }}-*
          path: dist
          merge-multiple: true

      # PyPI rejects new files for releases older than 14 days (400 Bad Request). A plugin
      # released with an unchanged version would then fail its upload job.
      - name: Skip wheels for releases older than 14 days
        id: skip
        shell: python
        run: |
          import datetime, json, os, pathlib, urllib.error, urllib.request

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              print("::warning::No wheels were downloaded, nothing to upload")
          limit = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=14)
          for wheel in wheels:
              name, version = wheel.name.split("-")[:2]
              url = f"https://pypi.org/pypi/{name.replace('_', '-')}/{version}/json"
              try:
                  with urllib.request.urlopen(url) as response:
                      files = json.load(response)["urls"]
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:  # new release
                      continue
                  raise
              uploads = [datetime.datetime.fromisoformat(f["upload_time_iso_8601"].replace("Z", "+00:00")) for f in files]
              if uploads and min(uploads) < limit:
                  print(f"::warning::Skipping {wheel.name}: release {name} {version} is older than 14 days")
                  wheel.unlink()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"wheels={len(list(pathlib.Path('dist').glob('*.whl')))}\n")

      - name: Publish wheels to PyPI
        if: steps.skip.outputs.wheels != '0'
        uses: pypa/gh-action-pypi-publish@v1.13.0 # v1.12.4 or newer is needed to support metadata v2.4 including PEP 639
        with:
          skip-existing: true
          packages-dir: dist
          verbose: true
